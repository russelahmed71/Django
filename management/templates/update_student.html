{% extends 'base.html' %}

{% block title %}Update Student Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-warning text-dark fw-bold py-3 d-flex align-items-center justify-content-between">
                <span>✏️ Update Student Profile</span>
                <a href="{% url 'addStudent' %}" class="btn btn-sm btn-outline-dark fw-bold px-3 rounded-pill">Back to Dashboard</a>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'updateStudent' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <input type="hidden" name="id" value="{{ student.id }}">

                    <div class="text-center mb-4">
                        {% if student.profile_pic %}
                            <img src="{{ student.profile_pic.url }}" alt="Current Profile" class="rounded-circle border shadow-sm" style="width: 90px; height: 90px; object-fit: cover;">
                        {% else %}
                            <div class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center fw-bold shadow-sm" style="width: 90px; height: 90px; font-size: 32px;">
                                {{ student.name|slice:":1"|upper }}
                            </div>
                        {% endif %}
                        <div class="small text-muted mt-2">Current Profile Picture</div>
                    </div>

                    <div class="mb-3">
                        <label for="editName" class="form-label small fw-bold text-secondary">Full Name</label>
                        <input type="text" name="name" id="editName" class="form-control" value="{{ student.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="editRoll" class="form-label small fw-bold text-secondary">Roll No.</label>
                        <input type="text" name="roll" id="editRoll" class="form-control" value="{{ student.roll }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="editSemester" class="form-label small fw-bold text-secondary">Semester</label>
                        <input type="text" name="semester" id="editSemester" class="form-control" value="{{ student.semester }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="editDepartment" class="form-label small fw-bold text-secondary">Department</label>
                        <input type="text" name="department" id="editDepartment" class="form-control" value="{{ student.department }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="editPicture" class="form-label small fw-bold text-secondary">Change Profile Picture (Optional)</label>
                        <input type="file" name="profile_pic" id="editPicture" class="form-control" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm text-dark">Save Modifications</button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
