{% extends 'base.html' %}

{% block title %}Login - Student Management{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-4">
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger shadow-sm" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center fw-bold py-3">
                🔐 Account Login
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="usernameInput" class="form-label small fw-bold text-secondary">Username</label>
                        <input type="text" name="username" id="usernameInput" class="form-control form-control-lg" placeholder="Enter username" required>
                    </div>

                    <div class="mb-4">
                        <label for="passwordInput" class="form-label small fw-bold text-secondary">Password</label>
                        <input type="password" name="password" id="passwordInput" class="form-control form-control-lg" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2 shadow-sm text-white">Sign In</button>
                </form>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
