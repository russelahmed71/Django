{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 mt-4">
            <div class="card-header bg-dark py-3 text-center">
                <h4 class="mb-0 text-white fw-bold">🔒 Change Account Password</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'changePassword' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Current Password</label>
                        <input type="password" name="old_password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success fw-bold py-2">Update Password</button>
                        <a href="{% url 'addStudent' %}" class="btn btn-link text-secondary text-center small mt-2">Back to Dashboard</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
