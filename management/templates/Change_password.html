{% extends 'base.html' %}

{% block title %}Change Account Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} shadow-sm" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="card shadow-sm border-0">
            <div class="card-header bg-danger text-white fw-bold py-3">
                🔒 Change Password
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label small fw-bold text-secondary">Current Password</label>
                        <input type="password" name="old_password" id="currentPassword" class="form-control" placeholder="Enter current password" required>
                    </div>

                    <hr class="text-muted my-4">

                    <div class="mb-3">
                        <label for="newPassword" class="form-label small fw-bold text-secondary">New Password</label>
                        <input type="password" name="new_password" id="newPassword" class="form-control" placeholder="Create new password" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label small fw-bold text-secondary">Confirm New Password</label>
                        <input type="password" name="confirm_password" id="confirmPassword" class="form-control" placeholder="Repeat new password" required>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm text-white">Update Password</button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
