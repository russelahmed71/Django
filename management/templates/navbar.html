<nav class="navbar navbar-dark bg-dark mb-4 rounded-bottom shadow-sm">
    <div class="container-fluid px-3 d-flex align-items-center justify-content-between">
        
        <div class="d-flex align-items-center gap-3">
            <a href="{% url 'addStudent' %}" class="navbar-brand fw-bold text-success mb-0 p-0">📋 Dashboard</a>
            
            <form class="d-flex m-0" role="search" onsubmit="return false;" style="max-width: 180px;">
                <input class="form-control form-control-sm bg-white text-dark" type="search" id="navbarSearch" placeholder="Search..." aria-label="Search">
            </form>
        </div>
        
        <div class="d-flex align-items-center gap-3">
            {% if request.user.is_authenticated %}
                <div class="d-flex align-items-center gap-2 text-white">
                    <span class="badge bg-success rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; font-weight: bold;">
                        {{ request.user.username|slice:":1"|upper }}
                    </span>
                    <span class="small text-white">{{ request.user.username }}</span>
                </div>
                <a href="{% url 'logoutView' %}" class="btn btn-sm btn-danger text-white">Logout</a>
            {% endif %}
        </div>
        
    </div>
</nav>

<script>
    let searchInput = document.getElementById('navbarSearch');
    if (searchInput) {
        searchInput.addEventListener('keyup', function() {
            let filter = this.value.toLowerCase();
            let rows = document.querySelectorAll('table tbody tr');
            rows.forEach(row => {
                if(row.cells.length > 1) {
                    let text = row.textContent.toLowerCase();
                    row.style.display = text.includes(filter) ? '' : 'none';
                }
            });
        });
    }
</script>
